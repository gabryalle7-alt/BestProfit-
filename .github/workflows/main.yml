          w('app/src/main/res/layout/activity_setup.xml', '''
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent">
              <LinearLayout android:orientation="vertical" android:padding="16dp" android:layout_width="match_parent" android:layout_height="wrap_content">
                  <TextView android:text="Ghid Honor" android:textSize="18sp" android:textStyle="bold" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
              </LinearLayout>
          </ScrollView>
          ''')          # ---------- PARTEA 2 ----------
          w('app/src/main/java/ro/profitride/App.kt', r'''
          package ro.profitride
          import android.app.Application
          import android.content.Context
          import androidx.appcompat.app.AppCompatDelegate

          class App : Application() {
              override fun onCreate() {
                  super.onCreate()
                  applyTheme(this)
              }
              companion object {
                  fun applyTheme(ctx: Context) {
                      val m = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE).getInt("themeMode", 0)
                      AppCompatDelegate.setDefaultNightMode(
                          when (m) {
                              1 -> AppCompatDelegate.MODE_NIGHT_NO
                              2 -> AppCompatDelegate.MODE_NIGHT_YES
                              else -> AppCompatDelegate.MODE_NIGHT_FOLLOW_SYSTEM
                          }
                      )
                  }
              }
          }
          ''')

          w('app/src/main/java/ro/profitride/OfferParser.kt', r'''
          package ro.profitride

          object OfferParser {
              data class Offer(val priceRon: Float, val pickupKm: Float, val tripKm: Float, val pickupMinutes: Int, val tripMinutes: Int)
              private val PRICE_LBL = Regex("""(\d+(?:[.,]\d{1,2})?)\s*(?:RON|lei)""", RegexOption.IGNORE_CASE)
              private val PRICE_ANY = Regex("""(\d+(?:[.,]\d{1,2})?)""")
              private val KM_RE = Regex("""(\d+(?:[.,]\d+)?)\s*km""", RegexOption.IGNORE_CASE)
              private val MIN_RE = Regex("""(\d+)\s*min""", RegexOption.IGNORE_CASE)

              fun parse(text: String, avgSpeed: Float = 25f): Offer? {
                  return try {
                      val price = findPrice(text) ?: return null
                      val kms = KM_RE.findAll(text).mapNotNull { it.groupValues[1].replace(',', '.').toFloatOrNull() }.toList()
                      val mins = MIN_RE.findAll(text).mapNotNull { it.groupValues[1].toIntOrNull() }.toList()
                      if (kms.isEmpty()) return null
                      var pk = 0f; var tk = 0f
                      if (kms.size >= 2) { pk = kms[0]; tk = kms[1] } else tk = kms[0]
                      var pm = 0; var tm = 0
                      if (mins.size >= 2) { pm = mins[0]; tm = mins[1] } else if (mins.size == 1) tm = mins[0]
                      if (tm == 0) tm = ((tk / avgSpeed) * 60).toInt()
                      if (pm == 0) pm = ((pk / avgSpeed) * 60).toInt()
                      Offer(price, pk, tk, pm, tm)
                  } catch (_: Throwable) { null }
              }

              private fun findPrice(text: String): Float? {
                  val lbl = PRICE_LBL.findAll(text).mapNotNull { it.groupValues[1].replace(',', '.').toFloatOrNull() }.filter { it in 3f..2000f }.maxOrNull()
                  if (lbl != null) return lbl
                  return PRICE_ANY.findAll(text).mapNotNull { m ->
                      val v = m.groupValues[1]
                      val after = text.substring(m.range.last + 1).take(10).lowercase()
                      if (after.contains("km") || after.contains("min") || after.contains("ron")) null else v.replace(',', '.').toFloatOrNull()
                  }.filter { it in 5f..500f }.maxOrNull()
              }
          }
          ''')

          w('app/src/main/java/ro/profitride/Calc.kt', r'''
          package ro.profitride
          import android.content.Context
          import android.graphics.Color

          object Calc {
              val GREEN = Color.parseColor("#4CAF50")
              val YELLOW = Color.parseColor("#FFEB3B")
              val RED = Color.parseColor("#FF5252")

              data class Result(
                  val text: String, val color: Int, val label: String, val level: Int,
                  val grossPerKm: Float, val grossPerHour: Float, val netProfit: Float,
                  val totalExpenses: Float, val commissionCut: Float, val fuelCost: Float, val extraCost: Float,
                  val totalKm: Float, val totalMin: Int, val priceRon: Float, val speech: String, val longPickup: Boolean
              )

              fun compute(ctx: Context, o: OfferParser.Offer): Result {
                  val p = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE)
                  val fuel = p.getFloat("fuelPrice", 7.5f)
                  val cons = p.getFloat("consumption", 7f)
                  val com = p.getFloat("commission", 20f)
                  val extra = p.getFloat("extraCost", 0.5f)
                  val minKm = p.getFloat("minPerKm", 2.5f)
                  val minHour = p.getFloat("minPerHour", 60f)
                  val longPick = p.getFloat("longPickupKm", 4f)
                  val minKmLong = p.getFloat("minPerKmLong", 3f)

                  val totalKm = o.pickupKm + o.tripKm
                  val totalMin = o.pickupMinutes + o.tripMinutes
                  val grossKm = if (totalKm > 0f) o.priceRon / totalKm else 0f
                  val grossH = if (totalMin > 0) o.priceRon / (totalMin / 60f) else 0f
                  val comCut = o.priceRon * com / 100f
                  val fuelCost = totalKm / 100f * cons * fuel
                  val extraCost = totalKm * extra
                  val exp = comCut + fuelCost + extraCost
                  val net = o.priceRon - exp

                  val isLong = longPick > 0f && o.pickupKm >= longPick
                  val minEff = if (isLong) maxOf(minKm, minKmLong) else minKm
                  val lvKm = when { grossKm >= minEff * 1.2f -> 2; grossKm >= minEff -> 1; else -> 0 }
                  val lvH = if (totalMin <= 0 || minHour <= 0f) 2 else when { grossH >= minHour * 1.2f -> 2; grossH >= minHour -> 1; else -> 0 }
                  val level = minOf(lvKm, lvH)
                  val label = when (level) { 2 -> "PROFITABIL"; 1 -> "MEDIU"; else -> "NEPROFITABIL" }
                  val color = when (level) { 2 -> GREEN; 1 -> YELLOW; else -> RED }

                  val text = "[%s]\n%.2f RON/km\n%.1f km · %d min\n%.2f RON".format(label, grossKm, totalKm, totalMin, o.priceRon)
                  val speech = when (level) {
                      2 -> "Profitabil. %.1f lei pe km.".format(grossKm)
                      1 -> "Mediu."
                      else -> "Neprofitabil."
                  }
                  return Result(text, color, label, level, grossKm, grossH, net, exp, comCut, fuelCost, extraCost, totalKm, totalMin, o.priceRon, speech, isLong)
              }
          }
          ''')

          w('app/src/main/java/ro/profitride/Trips.kt', r'''
          package ro.profitride
          import android.content.Context
          import java.util.Calendar

          object Trips {
              data class Trip(val line: Int, val ts: Long, val price: Float, val pk: Float, val tk: Float, val gross: Float,
                              val min: Float, val exp: Float, val net: Float, val com: Float, val fuel: Float, val wear: Float)
              data class Rej(val ts: Long, val price: Float, val km: Float, val net: Float, val good: Boolean)
              data class Stats(val count: Int, val rev: Float, val net: Float, val fixed: Float, val netAfterFixed: Float,
                               val km: Float, val min: Float, val revH: Float, val days: Int)

              fun readAll(ctx: Context): Pair<List<Trip>, Int> {
                  val out = ArrayList<Trip>()
                  var bad = 0
                  try {
                      ctx.openFileInput("offers.csv").bufferedReader().useLines { lines ->
                          lines.forEachIndexed { i, raw ->
                              val t = raw.trim()
                              if (t.isEmpty()) return@forEachIndexed
                              val p = t.split(",")
                              val ts = p.getOrNull(0)?.toLongOrNull()
                              if (p.size < 8 || ts == null) { bad++; return@forEachIndexed }
                              fun f(k: Int): Float = p.getOrNull(k)?.toFloatOrNull() ?: 0f
                              out.add(Trip(i, ts, f(1), f(2), f(3), f(4), f(5), f(6), f(7), f(8), f(9), f(10)))
                          }
                      }
                  } catch (_: Exception) {}
                  return Pair(out, bad)
              }

              fun deleteLine(ctx: Context, line: Int): Boolean {
                  return try {
                      val lines = ctx.openFileInput("offers.csv").bufferedReader().use { it.readLines() }.toMutableList()
                      if (line !in lines.indices) return false
                      lines.removeAt(line)
                      ctx.openFileOutput("offers.csv", Context.MODE_PRIVATE).bufferedWriter().use { w -> lines.forEach { w.appendLine(it) } }
                      true
                  } catch (_: Exception) { false }
              }

              fun readRejected(ctx: Context, since: Long): List<Rej> {
                  val out = ArrayList<Rej>()
                  try {
                      ctx.openFileInput("rejected.csv").bufferedReader().useLines { lines ->
                          lines.forEach { raw ->
                              val p = raw.trim().split(",")
                              val ts = p.getOrNull(0)?.toLongOrNull() ?: return@forEach
                              if (p.size < 8 || ts < since) return@forEach
                              out.add(Rej(ts, p[1].toFloatOrNull() ?: 0f, (p[2].toFloatOrNull() ?: 0f) + (p[3].toFloatOrNull() ?: 0f), p[6].toFloatOrNull() ?: 0f, p[7] == "1"))
                          }
                      }
                  } catch (_: Exception) {}
                  return out
              }

              fun startOf(period: String): Long {
                  val c = Calendar.getInstance()
                  c.set(Calendar.HOUR_OF_DAY, 0); c.set(Calendar.MINUTE, 0); c.set(Calendar.SECOND, 0); c.set(Calendar.MILLISECOND, 0)
                  when (period) {
                      "WEEK" -> c.set(Calendar.DAY_OF_WEEK, c.firstDayOfWeek)
                      "MONTH" -> c.set(Calendar.DAY_OF_MONTH, 1)
                      "YEAR" -> c.set(Calendar.DAY_OF_YEAR, 1)
                  }
                  return c.timeInMillis
              }

              fun effStart(ctx: Context, period: String): Long =
                  maxOf(startOf(period), ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE).getLong("reset_$period", 0L))

              fun dayKey(ts: Long): Int {
                  val c = Calendar.getInstance()
                  c.timeInMillis = ts
                  return c.get(Calendar.YEAR) * 1000 + c.get(Calendar.DAY_OF_YEAR)
              }

              fun stats(ctx: Context, period: String): Stats {
                  val eff = effStart(ctx, period)
                  val list = readAll(ctx).first.filter { it.ts >= eff }
                  val fixedDay = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE).getFloat("fixedDaily", 0f)
                  var rev = 0f; var net = 0f; var km = 0f; var min = 0f; var revH = 0f
                  for (t in list) {
                      rev += t.price; net += t.net; km += t.pk + t.tk
                      if (t.min > 0f) { min += t.min; revH += t.price }
                  }
                  val days = list.map { dayKey(it.ts) }.toSet().size
                  val fixed = fixedDay * days
                  return Stats(list.size, rev, net, fixed, net - fixed, km, min, revH, days)
              }
          }
          ''')

