            + '</LinearLayout></ScrollView>')

          sets = [('etFuelPrice', 'Preț benzină (RON/L)'), ('etConsumption', 'Consum (L/100km)'), ('etCommission', 'Comision (%)'),
                  ('etExtraCost', 'Uzură (RON/km)'), ('etFixedDaily', 'Cheltuieli fixe (RON / zi lucrată)'), ('etGoal', 'Obiectiv zilnic net (RON)'),
                  ('etMinPerKm', 'Prag minim RON/km'), ('etMinPerHour', 'Prag minim RON/oră'), ('etLongPickup', 'Preluare lungă de la (km)'),
                  ('etMinPerKmLong', 'Prag RON/km pentru preluare lungă'), ('etAvgSpeed', 'Viteză medie (km/h)')]
          sbody = ''.join(card(i, l) for i, l in sets)
          w('app/src/main/res/layout/activity_settings.xml',
