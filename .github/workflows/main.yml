            '<LinearLayout android:orientation="vertical" android:padding="16dp" ' + LP + '>'
            + head('Setări', 'tvSetTitle') + sbody
            + btn('btnTts', 'Anunț vocal', '#9C27B0', 6) + btn('btnTheme', 'Temă', '#607D8B')
            + btn('btnSave', 'SALVEAZĂ', '#4CAF50', 16)
