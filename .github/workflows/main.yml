          package ro.profitride
          import android.content.Context
          import android.content.res.Configuration
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.util.AttributeSet
          import android.view.View

          class BarChartView @JvmOverloads constructor(context: Context, attrs: AttributeSet? = null) : View(context, attrs) {
              private var values: FloatArray = FloatArray(0)
              private var labels: Array<String> = emptyArray()
              private val barP = Paint(Paint.ANTI_ALIAS_FLAG)
              private val txtP = Paint(Paint.ANTI_ALIAS_FLAG).apply { textAlign = Paint.Align.CENTER }
              private val lineP = Paint().apply { strokeWidth = 2f }

              fun setData(v: FloatArray, l: Array<String>) {
                  values = v; labels = l; invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  try {
                      val n = values.size
                      if (n == 0) return
                      val d = resources.displayMetrics.density
                      val w = width.toFloat(); val h = height.toFloat()
                      val top = 18f * d; val bottom = h - 20f * d
                      val maxV = maxOf(values.maxOrNull() ?: 0f, 1f)
                      val minV = minOf(values.minOrNull() ?: 0f, 0f)
                      val range = maxV - minV
                      val zeroY = bottom - (0f - minV) / range * (bottom - top)
                      val slot = w / n
                      val bw = slot * 0.6f
                      val night = (resources.configuration.uiMode and Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES
                      val fg = if (night) Color.parseColor("#DDDDDD") else Color.parseColor("#444444")
                      txtP.color = fg; lineP.color = fg
                      canvas.drawLine(0f, zeroY, w, zeroY, lineP)
                      for (i in 0 until n) {
                          val v = values[i]
                          val cx = slot * i + slot / 2
                          val y = bottom - (v - minV) / range * (bottom - top)
                          barP.color = if (v >= 0f) Calc.GREEN else Calc.RED
                          val t = minOf(y, zeroY)
                          val b = maxOf(maxOf(y, zeroY), t + 1f)
                          canvas.drawRect(cx - bw / 2, t, cx + bw / 2, b, barP)
                          txtP.textSize = 10f * d
                          val lb = labels.getOrNull(i) ?: ""
                          if (lb.isNotEmpty()) canvas.drawText(lb, cx, h - 4f * d, txtP)
                          if (n <= 12 && v != 0f) {
                              txtP.textSize = 9f * d
                              canvas.drawText("%.0f".format(v), cx, t - 3f * d, txtP)
                          }
                      }
                  } catch (_: Throwable) {}
              }
          }
          ''')

