          package ro.profitride
          import android.app.AlertDialog
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class FuelActivity : AppCompatActivity() {
              data class Fill(val ts: Long, val odo: Float, val liters: Float, val price: Float)
              private val df = SimpleDateFormat("dd.MM.yy", Locale.getDefault())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  try {
                      setContentView(R.layout.activity_fuel)
                      findViewById<Button>(R.id.btnAddFuel).setOnClickListener { add() }
                      findViewById<Button>(R.id.btnApplyFuel).setOnClickListener { apply() }
                      findViewById<Button>(R.id.btnClearFuel).setOnClickListener {
                          AlertDialog.Builder(this).setTitle("Șterge istoricul").setMessage("Ștergi toate alimentările?")
                              .setPositiveButton("Da") { _, _ -> deleteFile("fuel.csv"); refresh() }
                              .setNegativeButton("Nu", null).show()
                      }
                      refresh()
                  } catch (e: Exception) { finish() }
              }

              private fun fills(): List<Fill> {
                  val out = ArrayList<Fill>()
                  try {
                      openFileInput("fuel.csv").bufferedReader().useLines { ls ->
                          ls.forEach { raw ->
                              val p = raw.trim().split(",")
                              if (p.size >= 4) {
                                  val ts = p[0].toLongOrNull(); val o = p[1].toFloatOrNull()
                                  val l = p[2].toFloatOrNull(); val pr = p[3].toFloatOrNull()
                                  if (ts != null && o != null && l != null && pr != null) out.add(Fill(ts, o, l, pr))
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return out.sortedBy { it.odo }
              }

              private fun consumption(f: List<Fill>): Float? {
                  if (f.size < 2) return null
                  val km = f.last().odo - f.first().odo
                  if (km <= 0f) return null
                  val l = f.drop(1).sumOf { it.liters.toDouble() }.toFloat()
                  return l / km * 100f
              }

              private fun num(id: Int): Float? = findViewById<EditText>(id).text.toString().replace(',', '.').toFloatOrNull()

              private fun add() {
                  val odo = num(R.id.etOdo); val l = num(R.id.etLiters); val pr = num(R.id.etPriceL)
                  if (odo == null || l == null || pr == null || odo <= 0f || l <= 0f || pr <= 0f) {
                      Toast.makeText(this, "Completează toate câmpurile", Toast.LENGTH_SHORT).show(); return
                  }
                  try {
                      openFileOutput("fuel.csv", MODE_APPEND).bufferedWriter().use { it.appendLine("${System.currentTimeMillis()},$odo,$l,$pr") }
                      findViewById<EditText>(R.id.etOdo).setText("")
                      findViewById<EditText>(R.id.etLiters).setText("")
                      findViewById<EditText>(R.id.etPriceL).setText("")
                      Toast.makeText(this, "Salvat", Toast.LENGTH_SHORT).show()
                      refresh()
                  } catch (_: Exception) {}
              }

              private fun apply() {
                  val f = fills()
                  val c = consumption(f)
                  if (c == null) { Toast.makeText(this, "Ai nevoie de minim 2 alimentări", Toast.LENGTH_SHORT).show(); return }
                  val last = f.maxByOrNull { it.ts } ?: return
                  getSharedPreferences("cfg", MODE_PRIVATE).edit().putFloat("consumption", c).putFloat("fuelPrice", last.price).apply()
                  Toast.makeText(this, "Aplicat: %.1f L/100km, %.2f RON/L".format(c, last.price), Toast.LENGTH_LONG).show()
              }

              private fun refresh() {
                  val f = fills()
                  val c = consumption(f)
                  val totL = f.sumOf { it.liters.toDouble() }
                  val avgP = if (totL > 0.0) (f.sumOf { (it.liters * it.price).toDouble() } / totL).toFloat() else 0f
                  val sb = StringBuilder()
                  sb.append("Alimentări: ${f.size}\n")
                  if (c != null) {
                      sb.append("Consum real: ${"%.2f".format(c)} L/100km\n")
                      sb.append("Preț mediu: ${"%.2f".format(avgP)} RON/L\n")
                      sb.append("Cost: ${"%.2f".format(c * avgP / 100f)} RON/km\n")
                  } else {
                      sb.append("Adaugă minim 2 alimentări pline\npentru a calcula consumul.\n")
                  }
                  if (f.isNotEmpty()) {
                      sb.append("----------\nUltimele:\n")
                      f.takeLast(5).reversed().forEach {
                          sb.append("${df.format(Date(it.ts))}  ${"%.0f".format(it.odo)} km  ${"%.1f".format(it.liters)} L  ${"%.2f".format(it.price)}\n")
                      }
                  }
                  findViewById<TextView>(R.id.tvFuelInfo).text = sb.toString().trimEnd()
              }
          }
          ''')

