            '<LinearLayout android:orientation="vertical" ' + LP + '>'
            + status + goalcard('tvToday', 'pbGoal', 'tvGoalInfo')
            + '<LinearLayout android:orientation="vertical" android:paddingLeft="16dp" android:paddingRight="16dp" android:paddingBottom="24dp" ' + LP + '>'
            + card('etPickup', 'Km până la preluare') + card('etTrip', 'Km cursă') + card('etPrice', 'Tarif oferit (RON)')
            + btn('btnCalc', 'CALCULEAZĂ', '#4CAF50', 4)
