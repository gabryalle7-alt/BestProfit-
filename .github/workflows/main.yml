            + head('Curse', 'tvTripsTitle')
            + '<TextView android:text="Atinge o cursă ca să o ștergi" android:textColor="@color/text_secondary" android:textSize="12sp" android:layout_marginBottom="8dp" ' + LP + '/>'
            + '<TextView android:id="@+id/tvTripsEmpty" android:text="Nicio cursă în această perioadă." android:textColor="@color/text_primary" android:visibility="gone" ' + LP + '/>'
            + '<ListView android:id="@+id/lvTrips" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:divider="@color/text_secondary" android:dividerHeight="1px"/>'
            + '</LinearLayout>')

          w('app/src/main/res/layout/activity_fuel.xml',
            '<?xml version="1.0" encoding="utf-8"?>\n<ScrollView ' + NS + ' android:layout_width="match_parent" android:layout_height="match_parent" android:background="@drawable/bg_gradient">'
            '<LinearLayout android:orientation="vertical" android:padding="16dp" ' + LP + '>'
            + head('Alimentări și consum real', 'tvFuelTitle')
            + '<TextView android:text="Alimentează plin de fiecare dată și notează kilometrajul de la bord." android:textColor="@color/text_secondary" android:textSize="12sp" android:layout_marginBottom="10dp" ' + LP + '/>'
            + card('etOdo', 'Kilometraj bord (km)') + card('etLiters', 'Litri alimentați') + card('etPriceL', 'Preț pe litru (RON)')
            + btn('btnAddFuel', 'SALVEAZĂ ALIMENTAREA', '#4CAF50', 4)
            + '<TextView android:id="@+id/tvFuelInfo" android:textSize="14sp" android:textColor="@color/text_primary" android:fontFamily="monospace" android:layout_marginTop="14dp" ' + CARD + ' android:padding="16dp" ' + LP + '/>'
            + btn('btnApplyFuel', 'APLICĂ ÎN SETĂRI', '#2196F3', 14)
            + btn('btnClearFuel', 'Șterge istoricul', '#F44336')
            + '</LinearLayout></ScrollView>')

          veh = [('etRca', 'RCA'), ('etRcaPers', 'RCA Persoane'), ('etRcaBag', 'RCA Bagaje'), ('etItp', 'ITP'), ('etStingator', 'Stingător'),
                 ('etTrusa', 'Trusă Medicală'), ('etCopie', 'Copie Conformă'), ('etEcusoane', 'Ecusoane'), ('etFisa', 'Fișă Medicală')]
          vbody = ''.join(card(i, l, 'Alege data', 'none', 'android:focusable="false" android:clickable="true"') for i, l in veh)
          w('app/src/main/res/layout/activity_vehicle.xml',
