          package ro.profitride
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.os.Bundle
          import android.widget.Button
          import android.widget.ProgressBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Locale

          class SummaryActivity : AppCompatActivity() {
              private lateinit var period: String
              private lateinit var prefs: SharedPreferences

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  try {
                      setContentView(R.layout.activity_summary)
                      period = intent.getStringExtra("PERIOADA") ?: "WEEK"
                      prefs = getSharedPreferences("cfg", MODE_PRIVATE)
                      findViewById<TextView>(R.id.tvSummaryTitle).text = when (period) {
                          "DAY" -> "Sumar zilnic"; "WEEK" -> "Sumar săptămânal"; "MONTH" -> "Sumar lunar"; "YEAR" -> "Sumar anual"; else -> "Sumar"
                      }
                      findViewById<Button>(R.id.btnTrips).setOnClickListener {
                          startActivity(Intent(this, TripsActivity::class.java).putExtra("PERIOADA", period))
                      }
                      findViewById<Button>(R.id.btnExport).setOnClickListener { export() }
                      findViewById<Button>(R.id.btnDeleteLast).setOnClickListener { deleteLast() }
                      findViewById<Button>(R.id.btnResetSummary).setOnClickListener {
                          AlertDialog.Builder(this).setTitle("Reset").setMessage("Ștergi datele din sumar?")
                              .setPositiveButton("Da") { _, _ -> prefs.edit().putLong("reset_$period", System.currentTimeMillis()).apply(); load() }
                              .setNegativeButton("Nu", null).show()
                      }
                  } catch (e: Exception) { finish() }
              }

              override fun onResume() {
                  super.onResume()
                  try { load() } catch (_: Exception) {}
              }

              private fun load() {
                  val st = Trips.stats(this, period)
                  val (all, corrupt) = Trips.readAll(this)
                  val eff = Trips.effStart(this, period)
                  val list = all.filter { it.ts >= eff }
                  var com = 0f; var fuel = 0f; var wear = 0f; var exp = 0f
                  for (t in list) { com += t.com; fuel += t.fuel; wear += t.wear; exp += t.exp }
                  val avg = if (st.km > 0f) st.rev / st.km else 0f
                  val goal = prefs.getFloat("goalDaily", 500f)
                  val perDay = if (period == "DAY") st.netAfterFixed else if (st.days > 0) st.netAfterFixed / st.days else 0f
                  val pct = if (goal > 0f) perDay / goal * 100f else 0f

                  findViewById<TextView>(R.id.tvSumGoal).text =
                      if (period == "DAY") "Obiectiv azi: %.0f / %.0f RON".format(perDay, goal)
                      else "Medie pe zi lucrată: %.0f / %.0f RON".format(perDay, goal)
                  findViewById<ProgressBar>(R.id.pbSumGoal).let {
                      it.progress = pct.toInt().coerceIn(0, 100)
                      it.progressTintList = ColorStateList.valueOf(if (pct >= 100f) Calc.GREEN else Color.parseColor("#2196F3"))
                  }
                  findViewById<TextView>(R.id.tvSumGoalInfo).text = if (goal <= 0f) "Setează un obiectiv în Setări" else "%.0f%% din obiectiv".format(pct)

                  findViewById<TextView>(R.id.tvStatRev).text = "%.0f".format(st.rev)
                  findViewById<TextView>(R.id.tvStatNet).text = "%.0f".format(st.netAfterFixed)
                  findViewById<TextView>(R.id.tvStatHour).text = if (st.min > 0f) "%.0f".format(st.revH / (st.min / 60f)) else "-"

                  val rej = Trips.readRejected(this, eff)
                  val rejGood = rej.filter { it.good }
                  val missed = rejGood.sumOf { it.net.toDouble() }.toFloat()

                  val sb = StringBuilder()
                  sb.append("CURSE: ${list.size}   ZILE: ${st.days}\n")
                  sb.append("KM: ${"%.1f".format(st.km)}\n")
                  sb.append("Tarif mediu: ${"%.2f".format(avg)} RON/km\n")
                  if (st.min > 0f) sb.append("RON/oră: ${"%.2f".format(st.revH / (st.min / 60f))}\n")
                  sb.append("----------\nCHELTUIELI\n")
                  sb.append("Comision: ${"%.2f".format(com)}\n")
                  sb.append("Combustibil: ${"%.2f".format(fuel)}\n")
                  sb.append("Uzură: ${"%.2f".format(wear)}\n")
                  sb.append("Fixe: ${"%.2f".format(st.fixed)}\n")
                  sb.append("Total: ${"%.2f".format(exp + st.fixed)} RON\n")
                  sb.append("----------\n")
                  sb.append("PROFIT NET: ${"%.2f".format(st.netAfterFixed)} RON\n")
                  sb.append("----------\n")
                  sb.append("OFERTE REFUZATE: ${rej.size}\n")
                  sb.append("Bune ratate: ${rejGood.size} (~${"%.0f".format(missed)} RON net)")
                  if (corrupt > 0) sb.append("\n⚠ $corrupt linii corupte")
                  findViewById<TextView>(R.id.tvSummaryContent).text = sb.toString()

                  buildChart()
              }

              private fun buildChart() {
                  val chart = findViewById<BarChartView>(R.id.chart) ?: return
                  val trips = Trips.readAll(this).first
                  val fixed = prefs.getFloat("fixedDaily", 0f)
                  val n = if (period == "YEAR") 12 else if (period == "MONTH") 30 else 7
                  val vals = FloatArray(n)
                  val daySets = Array(n) { HashSet<Int>() }
                  val labels = Array(n) { "" }
                  val title: String
                  if (period == "YEAR") {
                      title = "Profit net pe luni (anul acesta)"
                      for (i in 0 until n) labels[i] = (i + 1).toString()
                      val y = Calendar.getInstance().get(Calendar.YEAR)
                      for (t in trips) {
                          val c = Calendar.getInstance()
                          c.timeInMillis = t.ts
                          if (c.get(Calendar.YEAR) == y) {
                              val i = c.get(Calendar.MONTH)
                              vals[i] += t.net
                              daySets[i].add(Trips.dayKey(t.ts))
                          }
                      }
                  } else {
                      title = if (n == 7) "Profit net pe zile (ultimele 7 zile)" else "Profit net pe zile (ultimele 30 de zile)"
                      val starts = LongArray(n)
                      val fmt = SimpleDateFormat(if (n == 7) "EE" else "d", Locale.getDefault())
                      for (i in 0 until n) {
                          val c = Calendar.getInstance()
                          c.set(Calendar.HOUR_OF_DAY, 0); c.set(Calendar.MINUTE, 0); c.set(Calendar.SECOND, 0); c.set(Calendar.MILLISECOND, 0)
                          c.add(Calendar.DAY_OF_YEAR, -(n - 1 - i))
                          starts[i] = c.timeInMillis
                          labels[i] = if (n == 7 || i % 5 == 4 || i == n - 1) fmt.format(c.time) else ""
                      }
                      for (t in trips) {
                          var idx = -1
                          for (i in n - 1 downTo 0) { if (t.ts >= starts[i]) { idx = i; break } }
                          if (idx >= 0) {
                              vals[idx] += t.net
                              daySets[idx].add(Trips.dayKey(t.ts))
                          }
                      }
                  }
                  for (i in 0 until n) vals[i] -= fixed * daySets[i].size
                  findViewById<TextView>(R.id.tvChartTitle).text = title
                  chart.setData(vals, labels)
              }

              private fun export() {
                  try {
                      val txt = try { openFileInput("offers.csv").bufferedReader().use { it.readText() } } catch (_: Exception) { "" }
                      if (txt.isBlank()) { Toast.makeText(this, "Nu există curse de exportat", Toast.LENGTH_SHORT).show(); return }
                      val header = "timestamp,tarif,km_preluare,km_cursa,ron_per_km,minute,cheltuieli,profit_net,comision,combustibil,uzura\n"
                      val i = Intent(Intent.ACTION_SEND)
                      i.type = "text/plain"
                      i.putExtra(Intent.EXTRA_SUBJECT, "ProfitRide - export curse")
                      i.putExtra(Intent.EXTRA_TEXT, header + txt)
                      startActivity(Intent.createChooser(i, "Export curse"))
                  } catch (_: Exception) {}
              }

              private fun deleteLast() {
                  val last = Trips.readAll(this).first.maxByOrNull { it.ts }
                  if (last == null) { Toast.makeText(this, "Nu există curse", Toast.LENGTH_SHORT).show(); return }
                  AlertDialog.Builder(this).setTitle("Șterge ultima cursă")
                      .setMessage("Ștergi cursa de %.2f RON (%.1f km)?".format(last.price, last.pk + last.tk))
                      .setPositiveButton("Da") { _, _ -> Trips.deleteLine(this, last.line); load() }
                      .setNegativeButton("Nu", null).show()
              }
          }
          ''')

