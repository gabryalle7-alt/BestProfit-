name: Build ProfitRide APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Setup keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ ! -f app/keystore.b64 ]; then
            echo "Prima rulare - generez keystore..."
            mkdir -p app
            keytool -genkeypair -v -keystore app/release.jks -keyalg RSA -keysize 2048 -validity 10000 \
              -alias profitride -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=ProfitRide, OU=Dev, O=ProfitRide, L=Bucuresti, S=Bucuresti, C=RO"
            base64 -w0 app/release.jks > app/keystore.b64
            rm app/release.jks
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/keystore.b64
            git commit -m "Auto: keystore persistent"
            git push
            base64 -d app/keystore.b64 > app/release.jks
            echo "Keystore creat si salvat"
          else
            echo "Keystore existent - decodez..."
            base64 -d app/keystore.b64 > app/release.jks
          fi

      - name: Create project files with Python
        run: |
          python3 - <<'PYEOF'
          import os

          def w(p, t):
              d = os.path.dirname(p)
              if d: os.makedirs(d, exist_ok=True)
              open(p, 'w', encoding='utf-8').write(t.strip() + '\n')

          NS = 'xmlns:android="http://schemas.android.com/apk/res/android"'
          LP = 'android:layout_width="match_parent" android:layout_height="wrap_content"'
          CARD = 'android:background="@drawable/card_bg" android:elevation="4dp" android:outlineProvider="background"'

          def card(eid, label, hint='0.0', inp='numberDecimal', extra=''):
              return (f'<LinearLayout android:orientation="vertical" {LP} {CARD} android:padding="14dp" android:layout_marginBottom="10dp">'
                      f'<TextView android:text="{label}" android:textColor="@color/text_secondary" android:textSize="12sp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>'
                      f'<EditText android:id="@+id/{eid}" {extra} android:inputType="{inp}" android:hint="{hint}" android:textColor="@color/text_primary" android:textColorHint="@color/text_secondary" android:textSize="18sp" android:textStyle="bold" android:background="@null" {LP}/></LinearLayout>')

          def btn(bid, text, color, top=8):
              return (f'<Button android:id="@+id/{bid}" android:text="{text}" android:background="@drawable/rounded_btn" android:backgroundTint="{color}" '
                      f'android:textColor="#FFFFFF" android:textStyle="bold" android:elevation="4dp" android:layout_marginTop="{top}dp" {LP}/>')

          def rowbtn(bid, text, color):
              return (f'<Button android:id="@+id/{bid}" android:text="{text}" android:background="@drawable/rounded_btn" android:backgroundTint="{color}" '
                      f'android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="12sp" android:layout_margin="2dp" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content"/>')

          def goalcard(a, b, c, margin='16dp'):
              return (f'<LinearLayout android:orientation="vertical" {LP} {CARD} android:padding="14dp" android:layout_marginBottom="10dp" android:layout_margin="{margin}">'
                      f'<TextView android:id="@+id/{a}" android:text="Azi" android:textColor="@color/text_primary" android:textSize="15sp" android:textStyle="bold" {LP}/>'
                      f'<ProgressBar android:id="@+id/{b}" style="?android:attr/progressBarStyleHorizontal" android:max="100" android:progress="0" android:layout_marginTop="8dp" android:layout_width="match_parent" android:layout_height="12dp"/>'
                      f'<TextView android:id="@+id/{c}" android:text="" android:textColor="@color/text_secondary" android:textSize="12sp" android:layout_marginTop="6dp" {LP}/></LinearLayout>')

          def stat(vid, label):
              return (f'<LinearLayout android:orientation="vertical" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:layout_margin="4dp" {CARD} android:padding="10dp">'
                      f'<TextView android:text="{label}" android:textColor="@color/text_secondary" android:textSize="11sp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>'
                      f'<TextView android:id="@+id/{vid}" android:text="-" android:textColor="@color/text_primary" android:textSize="20sp" android:textStyle="bold" android:layout_width="wrap_content" android:layout_height="wrap_content"/></LinearLayout>')

          def head(txt, tid):
              return f'<TextView android:id="@+id/{tid}" android:text="{txt}" android:textSize="22sp" android:textStyle="bold" android:textColor="@color/text_primary" android:layout_marginBottom="12dp" {LP}/>'

          w('README.md', '# ProfitRide')
          w('local.properties', 'sdk.dir=' + os.environ['ANDROID_HOME'])
          w('gradle.properties', 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8')
          w('settings.gradle', '''
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ProfitRide"
          include ':app'
          ''')
          w('build.gradle', '''
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          ''')
          w('app/build.gradle', '''
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          def ksPwd = System.getenv("KEYSTORE_PASSWORD")
          if (!ksPwd) throw new GradleException("Missing secret KEYSTORE_PASSWORD")
          android {
              namespace 'ro.profitride'
              compileSdk 34
              defaultConfig { applicationId "ro.profitride"; minSdk 24; targetSdk 34; versionCode 33; versionName "5.0" }
              signingConfigs { release { storeFile file("release.jks"); storePassword ksPwd; keyAlias "profitride"; keyPassword ksPwd } }
              buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false }; debug { signingConfig signingConfigs.release } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.work:work-runtime-ktx:2.9.0'
          }
          ''')

          w('app/src/main/AndroidManifest.xml', '''
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>
              <application android:name=".App" android:allowBackup="true" android:icon="@drawable/ic_car" android:label="ProfitRide"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <activity android:name=".SettingsActivity"/>
