          w('app/src/main/java/ro/profitride/OfferReader.kt', r'''
          package ro.profitride

          import android.accessibilityservice.AccessibilityService
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.core.content.ContextCompat
          import java.io.File
          import java.util.Locale

          class OfferReader : AccessibilityService() {

              companion object {
                  @Volatile var isStopped = false
                  @Volatile var instance: OfferReader? = null
                  private val PKGS = listOf("ee.mtakso", "com.ubercab", "com.mytaxi", "com.clever")
                  private const val DEDUP_MS = 60_000L
                  private const val HASH_MS = 300L
                  private const val MAX_LOG = 500_000L
                  private const val STALE_PENDING_MS = 10 * 60 * 1000L
                  private const val REOFFER_MS = 30_000L
                  private const val REJECT_MS = 40_000L
              }

              private var overlay: View? = null
              private var sideBarView: View? = null
              private var sidePanelView: View? = null
              private lateinit var wm: WindowManager
              private val handler = Handler(Looper.getMainLooper())
              private val autoDismiss = Runnable { removeOverlay() }
              private var tts: TextToSpeech? = null
              private var vibrator: Vibrator? = null
              private val sb = StringBuilder(2048)
              private var lastTextHash = 0
              private var lastTextTime = 0L
              private var lastOfferKey = ""
              private var lastOfferAt = 0L
              private var pendingOffer: OfferParser.Offer? = null
              private var pendingAt = 0L
              private var lastSavedPrice = 0f
              private var lastSavedKm = 0f
              private var lastSavedAt = 0L

              private fun isOfficial(p: String) = PKGS.any { p.startsWith(it) }

              private fun log(m: String) {
                  try {
                      val f = File(filesDir, "debug.txt")
                      if (f.exists() && f.length() > MAX_LOG) f.delete()
                      f.appendText("${System.currentTimeMillis()}: $m\n")
                  } catch (_: Throwable) {}
              }

              private val screenOff = object : BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) {
                      if (i?.action == Intent.ACTION_SCREEN_OFF) { removeOverlay(); removeSidePanel() }
                  }
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  try {
                      instance = this
                      wm = getSystemService(WINDOW_SERVICE) as WindowManager
                      vibrator = if (Build.VERSION.SDK_INT >= 31)
                          (getSystemService(VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator
                      else @Suppress("DEPRECATION") getSystemService(VIBRATOR_SERVICE) as Vibrator
                      tts = TextToSpeech(this) { if (it == TextToSpeech.SUCCESS) tts?.language = Locale("ro", "RO") }
                      try { ContextCompat.registerReceiver(this, screenOff, IntentFilter(Intent.ACTION_SCREEN_OFF), ContextCompat.RECEIVER_NOT_EXPORTED) } catch (_: Throwable) {}
                      if (!isStopped) showSideBar()
                      log("SERVICE START")
                  } catch (_: Throwable) {}
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (isStopped) return
                  if (event == null) return
                  try {
                      val pkg = event.packageName?.toString()?.lowercase() ?: return
                      if (!isOfficial(pkg)) return

                      // Salvare la apasarea Accept / Confirm
                      if (event.eventType == AccessibilityEvent.TYPE_VIEW_CLICKED) {
                          val t = "${event.text?.joinToString(" ") ?: ""} ${event.source?.text ?: ""} ${event.source?.contentDescription ?: ""}".lowercase()
                          val now0 = System.currentTimeMillis()
                          val o = pendingOffer
                          if ((t.contains("accept") || t.contains("confirm")) && o != null && now0 - pendingAt < STALE_PENDING_MS) {
                              log("ACCEPT CLICK")
                              saveTrip(o.priceRon, o.pickupKm, o.tripKm, now0)
                              lastSavedPrice = o.priceRon; lastSavedKm = o.pickupKm + o.tripKm; lastSavedAt = now0
                              pendingOffer = null; lastOfferKey = ""
                          }
                          return
                      }

                      sb.setLength(0)
                      val roots = ArrayList<AccessibilityNodeInfo>()
                      try { windows?.forEach { w -> w.root?.let { r -> if (r.packageName?.toString()?.lowercase()?.let { isOfficial(it) } == true) roots.add(r) } } } catch (_: Throwable) {}
                      if (roots.isEmpty()) { rootInActiveWindow?.let { roots.add(it) } }
                      if (roots.isEmpty()) return
                      for (r in roots) collect(r, sb, 0)
                      val raw = sb.toString().lowercase()
                      if (raw.isEmpty()) return
                      val h = raw.hashCode()
                      val now = System.currentTimeMillis()
                      if (h == lastTextHash && now - lastTextTime < HASH_MS) return
                      lastTextHash = h; lastTextTime = now

                      val looksOffer = raw.contains("accept") || raw.contains("confirm") || raw.contains("selecteaz") || (raw.contains("km") && raw.contains("min") && (raw.contains("ron") || raw.contains("lei")))
                      if (!looksOffer && raw.contains("km")) log("SCREEN $pkg: " + raw.replace('\n', '|').take(300))
                      if (looksOffer) {
                          val offer = OfferParser.parse(raw, avgSpeed())
                          if (offer == null) log("NEPARSAT $pkg: " + raw.replace('\n', '|').take(300))
                          if (offer != null) {
                              val key = "${offer.priceRon}|${offer.pickupKm}|${offer.tripKm}"
                              val justSaved = Math.abs(offer.priceRon - lastSavedPrice) < 0.05f &&
                                  Math.abs(offer.pickupKm + offer.tripKm - lastSavedKm) < 0.05f && now - lastSavedAt < DEDUP_MS
                              if (!justSaved && (key != lastOfferKey || now - lastOfferAt > REOFFER_MS)) {
                                  val old = pendingOffer
                                  if (old != null && key != lastOfferKey) saveRejected(old)
                                  lastOfferKey = key; lastOfferAt = now
                                  pendingOffer = offer; pendingAt = now
                                  log("OFERTA: $key")
                                  showOverlay(Calc.compute(this, offer))
                                  handler.postDelayed({
                                      if (pendingOffer === offer) { saveRejected(offer); pendingOffer = null }
                                  }, REJECT_MS)
                              }
                          }
                      }
                  } catch (e: Throwable) { log("EVT ERR: ${e.message?.take(60)}") }
              }

              private fun saveRejected(o: OfferParser.Offer) {
                  try {
                      val r = Calc.compute(this, o)
                      val line = "${System.currentTimeMillis()},${o.priceRon},${o.pickupKm},${o.tripKm},${r.grossPerKm},${r.totalMin},${r.netProfit},${if (r.level == 2) 1 else 0}"
                      openFileOutput("rejected.csv", MODE_APPEND).bufferedWriter().use { it.appendLine(line) }
                      log("REFUZAT: ${o.priceRon} RON")
                  } catch (_: Throwable) {}
              }

              private fun saveTrip(price: Float, pk: Float, tk: Float, now: Long) {
                  try {
                      if (Math.abs(price - lastSavedPrice) < 0.05f && Math.abs((pk + tk) - lastSavedKm) < 0.05f && now - lastSavedAt < 3000L) {
                          log("DUP SKIP ${price}RON")
                          return
                      }
                      val offer = OfferParser.Offer(price, pk, tk, pendingOffer?.pickupMinutes ?: 0, pendingOffer?.tripMinutes ?: 0)
                      val r = Calc.compute(this, offer)
                      val line = "$now,$price,$pk,$tk,${r.grossPerKm},${r.totalMin},${r.totalExpenses},${r.netProfit},${r.commissionCut},${r.fuelCost},${r.extraCost}"
                      openFileOutput("offers.csv", MODE_APPEND).bufferedWriter().use { it.appendLine(line) }
                      log("SALVAT: $price RON, ${pk + tk} km")
                      handler.post {
                          Toast.makeText(this@OfferReader, "Salvat: ${"%.2f".format(price)} RON", Toast.LENGTH_SHORT).show()
                          showSaveConfirm(r)
                      }
                  } catch (e: Throwable) { log("SAVE ERR: ${e.message?.take(60)}") }
              }

              private fun showSaveConfirm(r: Calc.Result) {
                  try {
                      removeOverlay()
                      val d = resources.displayMetrics.density
                      val c = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          background = GradientDrawable().apply { setColor(Color.parseColor("#EE111111")); cornerRadius = 20f * d; setStroke((4 * d).toInt(), Calc.GREEN) }
                          setPadding((14 * d).toInt(), (10 * d).toInt(), (14 * d).toInt(), (10 * d).toInt())
                      }
                      c.addView(TextView(this).apply { text = "Salvat"; setTextColor(Calc.GREEN); textSize = 15f; typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER })
                      c.addView(TextView(this).apply { text = "%.2f RON · %.1f km".format(r.priceRon, r.totalKm); setTextColor(Color.WHITE); textSize = 12f; gravity = Gravity.CENTER })
                      val t = if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
                      val p = WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, t, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT)
                      p.gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL; p.y = (150 * d).toInt()
                      wm.addView(c, p); overlay = c; handler.postDelayed({ removeOverlay() }, 3000L)
                  } catch (_: Throwable) {}
              }

              private fun avgSpeed(): Float {
                  val v = getSharedPreferences("cfg", MODE_PRIVATE).getFloat("avgSpeedKmh", 25f)
                  return if (v >= 5f) v else 25f
              }
              private fun collect(n: AccessibilityNodeInfo?, b: StringBuilder, d: Int) {
                  if (n == null || d > 40 || b.length > 20000) return
                  n.text?.toString()?.trim()?.let { if (it.isNotEmpty()) b.append(it).append('\n') }
                  n.contentDescription?.toString()?.trim()?.let { if (it.isNotEmpty()) b.append(it).append('\n') }
                  for (i in 0 until n.childCount) collect(n.getChild(i), b, d + 1)
              }
              private fun speak(r: Calc.Result) {
                  val mode = getSharedPreferences("cfg", MODE_PRIVATE).getInt("ttsMode", 1)
                  val ok = when (mode) { 1 -> true; 2 -> r.level == 2; 3 -> r.level == 0; else -> false }
                  if (!ok) return
                  try { tts?.speak(r.speech, TextToSpeech.QUEUE_FLUSH, null, "o") } catch (_: Throwable) {}
              }
              private fun vibrate(level: Int) {
                  try {
                      val v = vibrator ?: return
                      val ms = when (level) { 2 -> 120L; 1 -> 250L; else -> 500L }
                      if (Build.VERSION.SDK_INT >= 26) v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE)) else @Suppress("DEPRECATION") v.vibrate(ms)
                  } catch (_: Throwable) {}
              }

              private fun showOverlay(r: Calc.Result) {
                  try {
                      removeOverlay()
                      val d = resources.displayMetrics.density
                      fun dp(v: Int): Int = (v * d).toInt()
                      val c = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          background = GradientDrawable().apply { setColor(Color.parseColor("#F2000000")); cornerRadius = 22f * d; setStroke(dp(5), r.color) }
                          setPadding(dp(12), dp(10), dp(12), dp(10))
                          setOnTouchListener(dragListener()); elevation = 18f
                      }
                      val hr = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                      hr.addView(TextView(this).apply {
                          text = r.label; setTextColor(Color.BLACK); textSize = 20f; typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER
                          setPadding(dp(10), dp(4), dp(10), dp(4))
                          background = GradientDrawable().apply { setColor(r.color); cornerRadius = 12f * d }
                          layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      })
                      hr.addView(TextView(this).apply { text = "X"; setTextColor(Color.parseColor("#AAAAAA")); textSize = 18f; setPadding(dp(12), 0, dp(4), 0); setOnClickListener { removeOverlay() } })
                      c.addView(hr)

                      fun col(big: String, small: String): LinearLayout {
                          val box = LinearLayout(this@OfferReader)
                          box.orientation = LinearLayout.VERTICAL
                          box.gravity = Gravity.CENTER
                          box.layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                          val b = TextView(this@OfferReader)
                          b.text = big; b.setTextColor(r.color); b.textSize = 38f; b.typeface = Typeface.DEFAULT_BOLD; b.gravity = Gravity.CENTER
                          val s = TextView(this@OfferReader)
                          s.text = small; s.setTextColor(Color.parseColor("#BBBBBB")); s.textSize = 12f; s.gravity = Gravity.CENTER
                          box.addView(b); box.addView(s)
                          return box
                      }
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER; setPadding(0, dp(8), 0, dp(4)) }
                      row.addView(col("%.2f".format(r.grossPerKm), "RON/km"))
                      row.addView(col("%.0f".format(r.netProfit), "RĂMÂNE"))
                      c.addView(row)

                      val hour = if (r.grossPerHour > 0f) "RON/oră: %.0f  ·  ".format(r.grossPerHour) else ""
                      c.addView(TextView(this).apply {
                          text = hour + "%.1f km · %d min · %.2f RON".format(r.totalKm, r.totalMin, r.priceRon)
                          setTextColor(Color.WHITE); textSize = 13f; gravity = Gravity.CENTER
                      })
                      c.addView(TextView(this).apply {
                          text = "Cheltuieli: %.0f RON".format(r.totalExpenses) + if (r.longPickup) "   ⚠ Preluare lungă" else ""
                          setTextColor(Color.parseColor(if (r.longPickup) "#FFB74D" else "#AAAAAA")); textSize = 12f; gravity = Gravity.CENTER
                      })

                      val t = if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
                      val p = WindowManager.LayoutParams(dp(320), WindowManager.LayoutParams.WRAP_CONTENT, t, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT)
                      p.gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL; p.y = dp(90)
                      wm.addView(c, p); overlay = c; c.tag = p
                      handler.postDelayed(autoDismiss, 25_000L)
                      speak(r); vibrate(r.level)
                  } catch (_: Throwable) {}
              }

              private fun dragListener(): View.OnTouchListener {
                  var sx = 0; var sy = 0; var tx = 0f; var ty = 0f; var mv = false
                  return View.OnTouchListener { v, e ->
                      val p = v.tag as? WindowManager.LayoutParams ?: return@OnTouchListener false
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { sx = p.x; sy = p.y; tx = e.rawX; ty = e.rawY; mv = false; true }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - tx).toInt(); val dy = (e.rawY - ty).toInt()
                              if (dx * dx + dy * dy > 100) mv = true
                              if (mv) { p.x = sx + dx; p.y = sy + dy; try { wm.updateViewLayout(v, p) } catch (_: Exception) {} }
                              true
                          }
                          MotionEvent.ACTION_UP -> { if (!mv) removeOverlay(); true }
                          else -> false
                      }
                  }
              }
              private fun removeOverlay() {
                  try { handler.removeCallbacks(autoDismiss); overlay?.let { try { wm.removeView(it) } catch (_: Exception) {} }; overlay = null } catch (_: Throwable) {}
              }

              fun showSideBar() {
                  if (sideBarView != null) return
                  try {
                      val d = resources.displayMetrics.density
                      val bar = View(this).apply {
                          background = GradientDrawable().apply { shape = GradientDrawable.RECTANGLE; setColor(Color.parseColor("#80D32F2F")); cornerRadii = floatArrayOf(0f, 6f * d, 6f * d, 0f, 0f, 6f * d, 6f * d, 0f) }
                          setOnClickListener { toggleSidePanel() }; setOnTouchListener(barDrag())
                      }
                      val t = if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
                      val p = WindowManager.LayoutParams((6 * d).toInt(), (180 * d).toInt(), t, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL, PixelFormat.TRANSLUCENT)
                      p.gravity = Gravity.START or Gravity.CENTER_VERTICAL
                      wm.addView(bar, p); sideBarView = bar; bar.tag = p
                  } catch (_: Throwable) {}
              }

              private fun barDrag(): View.OnTouchListener {
                  var sy = 0; var ty = 0f; var mv = false
                  return View.OnTouchListener { v, e ->
                      val p = v.tag as? WindowManager.LayoutParams ?: return@OnTouchListener false
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { sy = p.y; ty = e.rawY; mv = false; true }
                          MotionEvent.ACTION_MOVE -> { val dy = (e.rawY - ty).toInt(); if (Math.abs(dy) > 15) mv = true; if (mv) { p.y = sy + dy; try { wm.updateViewLayout(v, p) } catch (_: Exception) {} }; true }
                          MotionEvent.ACTION_UP -> { if (!mv) v.performClick(); true }
                          else -> false
                      }
                  }
              }

              private fun toggleSidePanel() {
                  if (sidePanelView != null) { removeSidePanel(); return }
                  try {
                      val d = resources.displayMetrics.density
                      val p = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          background = GradientDrawable().apply { setColor(Color.parseColor("#F0111111")); cornerRadius = 20f * d; setStroke((2 * d).toInt(), Calc.GREEN) }
                          setPadding((16 * d).toInt(), (16 * d).toInt(), (16 * d).toInt(), (16 * d).toInt())
                      }
                      p.addView(TextView(this).apply { text = "ProfitRide Activ"; setTextColor(Calc.GREEN); textSize = 16f; typeface = Typeface.DEFAULT_BOLD; setPadding(0, 0, 0, (10 * d).toInt()) })
                      p.addView(TextView(this).apply { text = lastInfo(); setTextColor(Color.WHITE); textSize = 12f; typeface = Typeface.MONOSPACE; setPadding(0, 0, 0, (14 * d).toInt()) })
                      fun addBtn(txt: String, c: Int, a: () -> Unit) {
                          p.addView(Button(this).apply { text = txt; setTextColor(Color.WHITE); textSize = 13f; background = GradientDrawable().apply { setColor(c); cornerRadius = 30f * d }; setOnClickListener { a() } })
                      }
                      addBtn("Sumar", Color.parseColor("#9C27B0")) { removeSidePanel(); try { startActivity(Intent(this, SummaryActivity::class.java).putExtra("PERIOADA", "DAY").addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) } catch (_: Exception) {} }
                      addBtn("Curse azi", Color.parseColor("#009688")) { removeSidePanel(); try { startActivity(Intent(this, TripsActivity::class.java).putExtra("PERIOADA", "DAY").addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) } catch (_: Exception) {} }
                      addBtn("Setari", Color.parseColor("#2196F3")) { removeSidePanel(); try { startActivity(Intent(this, SettingsActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) } catch (_: Exception) {} }
                      addBtn("Opreste", Color.parseColor("#B71C1C")) { isStopped = true; removeSidePanel(); removeSideBar() }
                      val t = if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE
                      val lp = WindowManager.LayoutParams((280 * d).toInt(), WindowManager.LayoutParams.WRAP_CONTENT, t, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT)
                      lp.gravity = Gravity.START or Gravity.CENTER_VERTICAL; lp.x = (20 * d).toInt()
                      wm.addView(p, lp); sidePanelView = p
                      handler.postDelayed({ removeSidePanel() }, 15000L)
                  } catch (_: Throwable) {}
              }

              private fun lastInfo(): String {
                  return try {
                      val t = Trips.readAll(this).first.lastOrNull() ?: return "Nicio cursa."
                      val st = Trips.stats(this, "DAY")
                      "Ultima:\nTarif: ${"%.2f".format(t.price)} RON\nKm: ${"%.1f".format(t.pk + t.tk)}\nRON/km: ${"%.2f".format(t.gross)}\nNet: ${"%.2f".format(t.net)}\n--\nAzi: ${"%.0f".format(st.netAfterFixed)} RON (${st.count} curse)"
                  } catch (_: Exception) { "Nicio cursa." }
              }

              private fun removeSidePanel() { try { sidePanelView?.let { wm.removeView(it) } } catch (_: Throwable) {}; sidePanelView = null }
              private fun removeSideBar() { try { sideBarView?.let { wm.removeView(it) } } catch (_: Throwable) {}; sideBarView = null }

              override fun onInterrupt() { removeOverlay(); removeSideBar(); removeSidePanel() }
              override fun onDestroy() {
                  instance = null
                  removeOverlay(); removeSideBar(); removeSidePanel()
                  try { unregisterReceiver(screenOff) } catch (_: Throwable) {}
                  try { tts?.stop(); tts?.shutdown() } catch (_: Throwable) {}
                  tts = null; super.onDestroy()
              }
          }
          ''')
