              <color name="bg_start">#E3F2FD</color>
              <color name="bg_end">#FFFFFF</color>
              <color name="card">#FFFFFF</color>
              <color name="text_primary">#222222</color>
              <color name="text_secondary">#757575</color>
          </resources>
          ''')
          w('app/src/main/res/values-night/colors.xml', '''
          <resources>
              <color name="bg_start">#0D1B2A</color>
              <color name="bg_end">#121212</color>
