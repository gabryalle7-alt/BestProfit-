          w('app/src/main/res/drawable/bg_gradient.xml', '''
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><gradient android:startColor="@color/bg_start" android:endColor="@color/bg_end" android:angle="270" /></shape>
          ''')
          w('app/src/main/res/drawable/card_bg.xml', '''
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="@color/card"/><corners android:radius="16dp"/></shape>
          ''')
          w('app/src/main/res/drawable/rounded_btn.xml', '''
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#FFFFFF"/><corners android:radius="30dp"/></shape>
          ''')

          # ---------- LAYOUTS ----------
          status = '<TextView android:id="@+id/tvStatus" ' + LP + ' android:background="#111111" android:paddingTop="24dp" android:paddingBottom="24dp" android:gravity="center" android:textSize="22sp" android:textStyle="bold" android:textColor="#888888" android:elevation="8dp" android:text="Introdu datele cursei"/>'
          sumrow = ('<LinearLayout android:orientation="horizontal" android:layout_marginTop="8dp" ' + LP + '>'
                    + rowbtn('btnSumarZilnic', 'Zilnic', '#9C27B0') + rowbtn('btnSumarSaptamanal', 'Săpt.', '#4CAF50')
                    + rowbtn('btnSumarLunar', 'Lunar', '#FF9800') + rowbtn('btnSumarAnual', 'Anual', '#2196F3') + '</LinearLayout>')
          w('app/src/main/res/layout/activity_main.xml',
