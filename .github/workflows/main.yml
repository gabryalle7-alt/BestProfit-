            + btn('btnTrips', 'Curse de azi', '#009688', 12)
            + btn('btnFuel', 'Alimentări și consum real', '#795548')
            + btn('btnVehicle', 'Rubrică Autovehicul', '#E91E63')
            + btn('btnSettings', 'Setări', '#2196F3')
            + btn('btnAccessibility', 'Activează citirea', '#FF9800')
            + btn('btnOverlay', 'Permite overlay', '#9C27B0')
            + btn('btnDebug', 'Vezi log Debug', '#F44336')
            + btn('btnStopAll', 'OPRIRE TOTALĂ', '#B71C1C', 20)
            + '</LinearLayout></LinearLayout></ScrollView>')

          w('app/src/main/res/layout/activity_summary.xml',
            '<?xml version="1.0" encoding="utf-8"?>\n<ScrollView ' + NS + ' android:layout_width="match_parent" android:layout_height="match_parent" android:background="@drawable/bg_gradient">'
            '<LinearLayout android:orientation="vertical" android:padding="16dp" ' + LP + '>'
            + head('Sumar', 'tvSummaryTitle')
            + goalcard('tvSumGoal', 'pbSumGoal', 'tvSumGoalInfo', '0dp')
            + '<LinearLayout android:orientation="horizontal" ' + LP + '>' + stat('tvStatRev', 'VENITURI') + stat('tvStatNet', 'PROFIT NET') + stat('tvStatHour', 'RON / ORĂ') + '</LinearLayout>'
            + '<LinearLayout android:orientation="vertical" ' + LP + ' ' + CARD + ' android:padding="12dp" android:layout_marginTop="6dp" android:layout_marginBottom="10dp">'
              '<TextView android:id="@+id/tvChartTitle" android:text="Profit net" android:textColor="@color/text_secondary" android:textSize="12sp" ' + LP + '/>'
              '<ro.profitride.BarChartView android:id="@+id/chart" android:layout_width="match_parent" android:layout_height="170dp"/></LinearLayout>'
            + '<TextView android:id="@+id/tvSummaryContent" android:textSize="14sp" android:textColor="@color/text_primary" android:fontFamily="monospace" ' + CARD + ' android:padding="16dp" android:lineSpacingExtra="4dp" ' + LP + '/>'
            + btn('btnTrips', 'Lista curselor', '#009688', 14)
            + btn('btnExport', 'Export / backup CSV', '#2196F3')
            + btn('btnDeleteLast', 'Șterge ultima cursă', '#FF9800')
            + btn('btnResetSummary', 'RESETEAZĂ', '#F44336')
