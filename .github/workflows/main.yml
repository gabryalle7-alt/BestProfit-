              <path android:strokeColor="#FF1744" android:strokeWidth="11" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000" android:pathData="M48,24 L48,84 M48,24 L68,24 Q84,24 84,39 Q84,54 68,54 L48,54 M65,54 L84,84"/>
              <path android:strokeColor="#FF1744" android:strokeWidth="11" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000" android:pathData="M22,24 L22,84 M22,24 L44,24 Q60,24 60,39 Q60,54 44,54 L22,54"/>
          </vector>
          ''')

          w('app/src/main/res/xml/accessibility_service_config.xml', '''
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask" android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
